    // its OWN frames — from local text at the root, or text obtained from

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS

    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];

      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        // check below uses the in operator, which matches prototype keys

        // Text is accepted only from the direct parent — the document

    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;

      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

60px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.3)\">lilialatona.com/wishlist ↗<\u002Fa>\n<\u002Fdiv>\n<div style=\"justify-self:center;width:240px;height:300px;overflow:hidden;border:6px solid #2b3340;border-bottom:none;border-radius:32px 32px 0 0;background:#fff;align-self:end;margin-bottom:-32px\"><img src=\"4550ee61-d294-4139-84d2-a73df642a5ae\" style=\"width:100%;display:block\"><\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"background:#fff;border:1px solid #cfd6e6;border-radius:24px;padding:28px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<h2 style=\"font-family:'Dancing Script',cursive;color:#7a1830;font-size:48px;margin:0;line-height:1\">How to get in.<\u002Fh2>\n<div style=\"display:flex;gap:12px;align-items:center;background:#2b3340;color:#fff;border-radius:16px;padding:12px 16px;min-height:44px;font-size:17px\"><b style=\"font-family:'Gochi Hand',cursive;font-size:26px\">1<\u002Fb>Open the link on your phone.<\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:center;background:#2b3340;color:#fff;border-radius:16px;padding:12px 16px;min-height:44px;font-size:17px\"><b style=\"font-family:'Gochi Hand',cursive;font-size:26px\">2<\u002Fb>Tap “Sign in with Google”.<\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:center;background:#2b3340;color:#fff;border-radius:16px;padding:12px 16px;min-height:44px;font-size:17px\"><b style=\"font-family:'Gochi Hand',cursive;font-size:26px\">3<\u002Fb>Use the email Tim added for you.<\u002Fdiv>\n<p style=\"font-size:15px;line-height:1.45;margin:0\">A Google window pops up. If it closes without finishing, try Chrome or allow pop-ups. You stay signed in on that phone.<\u002Fp>\n<div style=\"font-family:'Gochi Hand',cursive;font-size:22px;color:#7a1830\">Stuck? Text Tim.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"justify-self:center;width:230px;height:380px;overflow:hidden;border:6px solid #2b3340;border-radius:30px\"><img src=\"64802b3a-0eb7-4751-aa95-ad96aab0db5c\" style=\"width:100%;display:block\"><\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;border:1px solid #cfd6e6;border-radius:24px;padding:28px 32px;display:flex;flex-direction:column;gap:16px\">\n<h2 style=\"font-family:'Dancing Script',cursive;color:#7a1830;font-size:48px;margin:0;line-height:1\">What you’ll find.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n<div style=\"background:#2b3340;color:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px\"><div style=\"height:230px;overflow:hidden;border-radius:10px;background:#fff\"><img src=\"4550ee61-d294-4139-84d2-a73df642a5ae\" style=\"width:100%;display:block;margin-top:-70px\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.3\">Tap “I’ll get this” so nobody doubles up.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#2b3340;color:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px\"><div style=\"height:230px;overflow:hidden;border-radius:10px;background:#fff\"><img src=\"280f7552-a44b-4570-90e4-64f3bd536349\" style=\"width:100%;display:block;margin-top:-170px\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.3\">Items with “🔗 3 options”: pick whichever you like.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#2b3340;color:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px\"><div style=\"height:230px;overflow:hidden;border-radius:10px;background:#fff\"><img src=\"c58b29e6-3071-40a2-9853-f71666b150d7\" style=\"width:100%;display:block;margin-top:-80px\"><\u002Fdiv><div style=\"font-size:16px;line-height:1.3\">Sizes &amp; favorites, for shopping.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px\">\n<div style=\"display:flex;gap:10px;align-items:center;min-height:48px;font-size:16px\"><span style=\"background:#c9973a;color:#1c1408;font-weight:700;font-size:14px;border-radius:12px;padding:4px 10px;white-space:nowrap\">★ Top wish<\u002Fspan>Gold ribbon = a Top wish.<\u002Fdiv>\n<div style=\"background:#f6e4e8;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.35\">Open ideas like candles or gift cards: several people can each get her something.<\u002Fdiv>\n<div style=\"background:#eef1f8;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.35\">Lilia can edit or delete anything, anytime.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#fff;border:1px solid #cfd6e6;border-radius:24px;padding:28px 32px;display:flex;flex-direction:column;gap:14px\">\n<h2 style=\"font-family:'Dancing Script',cursive;color:#7a1830;font-size:48px;margin:0;line-height:1\">She won’t see who.<\u002Fh2>\n<p style=\"font-size:17px;line-height:1.45;margin:0;max-width:60ch\">Lilia never sees who’s getting what: no names, no “Taken” stamps, no count of what’s covered. Everyone else just sees someone has it covered.<\u002Fp>\n<img src=\"48c5ba01-82ec-49dc-b39b-735b0c995ea5\" style=\"width:100%;display:block;border-radius:16px;border:1px solid #cfd6e6;background:#faf6f1\">\n<\u002Fsection>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n<section style=\"background:#fff;border:1px solid #cfd6e6;border-radius:24px;padding:28px 32px;display:flex;flex-direction:column;gap:12px\">\n<h2 style=\"font-family:'Dancing Script',cursive;color:#7a1830;font-size:48px;margin:0;line-height:1\">Plans change.<\u002Fh2>\n<p style=\"font-size:17px;line-height:1.45;margin:0\">If Lilia deletes or changes something you picked, you get a heads-up the next time you open the list. If you haven’t bought it yet, you can skip it.<\u002Fp>\n<\u002Fsection>\n<section style=\"background:#fff;border:1px solid #cfd6e6;border-radius:24px;padding:28px 32px;display:flex;flex-direction:column;gap:12px\">\n<h2 style=\"font-family:'Dancing Script',cursive;color:#7a1830;font-size:48px;margin:0;line-height:1\">Who can see it.<\u002Fh2>\n<p style=\"font-size:17px;line-height:1.45;margin:0\">Only people Lilia or Tim add, signed in with a Google account (any email address can have one). Need someone added? Ask Tim.<\u002Fp>\n<div style=\"background:#2b3340;color:#fff;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:700\">Not listed in search engines.<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<footer style=\"border-radius:24px;background:linear-gradient(200deg,#12204a 0%,#27478a 65%,#8bb7e6 100%);color:#fff;padding:32px;display:flex;flex-direction:column;gap:14px\">\n<h2 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:clamp(34px,6vw,48px);line-height:1.05;margin:0\">Happy <em style=\"color:#bfe0ff\">gifting<\u002Fem>.<\u002Fh2>\n<p style=\"font-size:18px;line-height:1.45;margin:0;max-width:56ch\">When the site updates, a “What’s new” banner shows up so you can see what changed.<\u002Fp>\n<div style=\"font-family:'Dancing Script',cursive;font-size:42px\">Love, Tim 🎁<\u002Fdiv>\n<div style=\"font-size:15px;color:#e6eefb\">Lilia’s wish list · v1.20<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fmain>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
