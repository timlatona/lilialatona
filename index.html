<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilia Latona</title>
<style>
  :root { --bg:#1b0f3a; --card:#5b2bb5; --card-hover:#7a45e0; --gold:#ffd166; --text:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; }
  h1 { color:var(--gold); font-size:clamp(2rem,8vw,3.5rem); margin:0 0 28px; text-align:center; }
  .links { display:grid; gap:14px; width:100%; max-width:420px; }
  a { display:block; background:var(--card); color:var(--text); text-decoration:none; border-radius:12px;
      padding:20px; text-align:center; font-size:1.3rem; font-weight:700; }
  a:hover, a:focus-visible { background:var(--card-hover); }
  a span { display:block; font-size:2rem; margin-bottom:4px; }
</style>
</head>
<body>
  <h1>Lilia Latona</h1>
  <nav class="links">
    <a href="wishlist/"><span>🎁</span>Wishlist</a>
    <a href="trivia/"><span>🎂</span>Birthday Trivia</a>
  </nav>
</body>
</html>
